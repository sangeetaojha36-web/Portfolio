<head>

    <meta name="description" content="Personal portfolio of Sangeeta Ojha, an AI/ML and software developer crafting intelligent systems, NLP tools, and human-centered digital experiences.">
    
    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website">

    <!-- Default Dark Mode Initialization (prevents flash of light mode) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sangeeta_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Fonts: Instrument Serif + Plus Jakarta Sans + JetBrains Mono -->
